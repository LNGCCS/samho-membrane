function bindStk(){
  var co=curCo();
  document.querySelectorAll(".sk").forEach(function(el){ el.oninput=function(){
    var st=stockOf(co,el.dataset.id);
    var cell=document.querySelector('.skdiff[data-id="'+el.dataset.id+'"]');
    if(el.value===""){ cell.textContent="-"; cell.style.color="var(--text-mute)"; return; }
    var d=(parseInt(el.value,10)||0)-st.qty;
    cell.textContent=(d>0?"+":"")+nf(d);
    cell.style.color=d<0?"var(--danger)":d>0?"var(--info)":"var(--ok)"; }; });

  var b=document.getElementById("skSave");
  if(b) b.onclick=async function(){
    if(!coGuard()) return;
    var lines=[];
    document.querySelectorAll(".sk").forEach(function(el){
      if(el.value==="") return;
      var it=itemById(el.dataset.id), st=stockOf(co,el.dataset.id);
      var real=parseInt(el.value,10)||0;
      lines.push({itemId:it.id,itemName:it.name,system:st.qty,real:real,diff:real-st.qty,unit:it.unit});
    });
    if(!lines.length){ alert("실물 수량을 하나 이상 입력하세요."); return; }
    if(!confirm(co+"의 "+lines.length+"개 품목 보유량을 실사값으로 보정합니다. 진행할까요?")) return;
    b.disabled=true; b.textContent="처리 중…";
    var note=document.getElementById("skNote").value.trim();
    for(var i=0;i<lines.length;i++){
      var l=lines[i];
      if(l.diff!==0){
        var lg={id:uid(),ts:Date.now(),type:"adj",company:co,itemId:l.itemId,itemName:l.itemName,
          unit:l.unit,qty:Math.abs(l.diff),taker:S.user.name,
          team:"실사보정 "+(l.diff>0?"+":"")+l.diff,by:S.user.id,byName:S.user.name};
        await push((function(lg,l){ return function(){ return db.rpc("apply_stock_movement",
          {p_log:M.logOut(lg),p_company:co,p_item_id:l.itemId,p_delta:l.diff}); }; })(lg,l));
      }
    }
    await push(function(){ return db.from("stocktakes").insert(M.stkOut({id:uid(),ts:Date.now(),
      company:co,by:S.user.id,byName:S.user.name,note:note,lines:lines,
      total:lines.reduce(function(s,l){return s+l.diff;},0)})); },"실사가 확정되었습니다.");
    S.msg.stk="실사가 확정되고 보유량이 보정되었습니다.";
    await pull(); render();
  };

  var c=document.getElementById("csvStk");
  if(c) c.onclick=function(){ var rows=[];
    S.stocktakes.forEach(function(s){ s.lines.forEach(function(l){
      rows.push([fmt(s.ts),s.company||"",s.byName,l.itemName,l.system,l.real,l.diff,s.note||""]); }); });
    exportCSV("재고실사",["일시","업체","실사자","품목","시스템재고","실물수량","차이","메모"],rows); };
}

  var byLv={1:[],2:[],3:[],4:[],5:[]};

  var lvOpts=function(sel){ return [1,2,3,4,5].map(function(n){
    return '<option value="'+n+'" '+(n===sel?"selected":"")+'>Lv.'+n+' · '+LEVEL_NAME[n]+'</option>'; }).join(""); };

  var coOpts=function(sel){ return COMPANIES.map(function(c){
    return '<option value="'+esc(c)+'" '+(c===sel?"selected":"")+'>'+esc(c)+'</option>'; }).join(""); };
  var pendRows=pend.map(function(u){
    return '<tr><td><span class="idtag">'+esc(u.id)+'</span></td>'+
      '<td class="kr">'+esc(u.name)+'</td>'+
      '<td><select class="apCo" data-id="'+esc(u.id)+'" style="width:auto;display:inline-block;">'+coOpts(u.company)+'</select></td>'+
      '<td>'+lvChip(u.reqLevel||1)+' <span style="color:var(--text-mute);font-size:11.5px;">신청</span></td>'+
      '<td>'+fmt(u.createdAt,true)+'</td>'+
      '<td><select class="apLv" data-id="'+esc(u.id)+'" style="width:auto;display:inline-block;">'+lvOpts(u.reqLevel||1)+'</select> '+
        '<button class="btn btn-primary btn-sm apOk" data-id="'+esc(u.id)+'">승인</button> '+

function bindGrant(){
  var U=function(id){ return S.users.filter(function(u){return u.id===id;})[0]; };
  var saveU=async function(u,msg){
    if(await push(function(){ return db.from("users").upsert(M.userOut(u)); },msg||"저장되었습니다.")){
      await pull(); render(); } };
  document.querySelectorAll(".apOk").forEach(function(el){ el.onclick=function(){
    var u=U(el.dataset.id);
    var sel=document.querySelector('.apLv[data-id="'+CSS.escape(el.dataset.id)+'"]');
    var coSel=document.querySelector('.apCo[data-id="'+CSS.escape(el.dataset.id)+'"]');
    u.status="approved"; u.level=+sel.value;
    if(coSel&&coSel.value) u.company=coSel.value;
    saveU(u,u.name+" 계정을 "+u.company+" · Lv."+u.level+"로 승인했습니다."); }; });
  document.querySelectorAll(".chCo").forEach(function(el){ el.onchange=function(){
    var u=U(el.dataset.id); var from=u.company; u.company=el.value;
    if(!confirm(u.name+"의 소속을 "+from+" → "+u.company+" 로 변경합니다.\n이 사용자가 앞으로 보는 재고·신청 화면이 바뀝니다. 계속할까요?")){ el.value=from; return; }
    saveU(u,u.name+" 소속을 "+u.company+"(으)로 변경했습니다."); }; });
  document.querySelectorAll(".apNo").forEach(function(el){ el.onclick=async function(){
    if(!confirm("가입 신청을 거절하고 삭제합니다.")) return;
    if(await push(function(){ return db.from("users").delete().eq("id",el.dataset.id); },"삭제되었습니다.")){
      await pull(); render(); } }; });
  document.querySelectorAll(".chLv").forEach(function(el){ el.onchange=function(){
    var u=U(el.dataset.id); u.level=+el.value; saveU(u,u.name+" 권한을 Lv."+u.level+"로 변경했습니다."); }; });
  document.querySelectorAll(".uSp").forEach(function(el){ el.onclick=function(){
    var u=U(el.dataset.id); u.status="suspended"; saveU(u,"정지되었습니다."); }; });
  document.querySelectorAll(".uRe").forEach(function(el){ el.onclick=function(){
    var u=U(el.dataset.id); u.status="approved"; saveU(u,"복구되었습니다."); }; });
  document.querySelectorAll(".mgGo").forEach(function(el){ el.onclick=async function(){
    var from=el.dataset.from;
    var sel=document.querySelector('.mgTo[data-from="'+CSS.escape(from)+'"]'); var to=sel?sel.value:null;
    if(!to){ return; }
    var x=strayCompanies().filter(function(z){ return z.company===from; })[0]||{};
    if(!confirm("'"+from+"' 소속으로 저장된 데이터를 '"+to+"'(으)로 이관합니다.\n\n신청 "+(x.requests||0)+"건 · 취급 품목 "+(x.stocks||0)+"건 · 로그 "+(x.logs||0)+"건 · 긴급 "+(x.emergencies||0)+"건 · 실사 "+(x.stocktakes||0)+"건\n\n되돌리기 어려우니 대상 업체를 다시 확인하세요. 계속할까요?")) return;
    el.disabled=true; el.textContent="이관 중…";
    if(await migrateCompany(from,to)){ await pull(); render(); } else { el.disabled=false; el.textContent="이관"; }
  }; });
  document.querySelectorAll(".uProcOn").forEach(function(el){ el.onclick=async function(){
    var u=U(el.dataset.id);
    var others=S.users.filter(function(x){ return x.id!==u.id&&(x.roles||"").indexOf("procure")>=0; });
    if(!confirm(u.name+"을(를) 발주 담당자로 지정합니다.\n발주 처리와 부서 공구실 부자재 신청 권한이 이 사람에게만 부여됩니다."+
      (others.length?"\n\n현재 담당자("+others.map(function(x){return x.name;}).join(", ")+")는 자동 해제됩니다.":""))) return;
    for(var k=0;k<others.length;k++){ others[k].roles=(others[k].roles||"").replace("procure","").trim();
      await push((function(o){ return function(){ return db.from("users").upsert(M.userOut(o)); }; })(others[k])); }
    u.roles=((u.roles||"")+" procure").trim();
    saveU(u,u.name+"이(가) 발주 담당자로 지정되었습니다."); }; });
  document.querySelectorAll(".uProcOff").forEach(function(el){ el.onclick=function(){
    var u=U(el.dataset.id); u.roles=(u.roles||"").replace("procure","").trim();
    saveU(u,u.name+"의 발주 담당을 해제했습니다."); }; });
  document.querySelectorAll(".uPw").forEach(function(el){ el.onclick=function(){
    var u=U(el.dataset.id);
    var np=prompt(u.name+" 계정의 새 비밀번호를 입력하세요 (6자 이상, 영문·숫자 권장)");
    if(np===null) return;
    if(np.trim().length<6){ alert("6자 이상 입력하세요."); return; }
    db.rpc("admin_reset_password",{p_id:u.id,p_new:np.trim()}).then(function(r){
      if(r.error) toast("초기화 실패: "+r.error.message,true); else toast(u.name+" 비밀번호가 초기화되었습니다."); }); }; });
  var c=document.getElementById("csvUsers");
  if(c) c.onclick=function(){ exportCSV("사용자권한",["아이디","이름","소속","권한","권한명","신청권한","상태","최근접속"],
    S.users.map(function(u){ return [u.id,u.name,u.company,"Lv."+u.level,LEVEL_NAME[u.level],
      "Lv."+(u.reqLevel||1),u.status,u.lastLogin?fmt(u.lastLogin):"미접속"]; })); };
}

function itemRowsData(){
  var cat=S.itmCat||"", q=(S.itmSearch||"").toLowerCase();
  var pool=S.items.filter(function(i){
    if(cat && (i.category||"")!==cat) return false;
    if(!q) return true;
    return (i.name+" "+(i.spec||"")+" "+(i.code||"")).toLowerCase().indexOf(q)>=0;
  });
  var usage={}; S.stocks.forEach(function(st){ usage[st.itemId]=(usage[st.itemId]||0)+1; });
  var rows=pool.slice(0,80).map(function(i){ return '<tr>'+
    '<td style="font-size:11px;">'+esc(i.code||i.id)+'</td>'+
    '<td><select class="mC" style="width:96px;">'+['<option value="">-</option>'].concat(catList().map(function(c){
      return '<option value="'+esc(c)+'" '+(c===i.category?"selected":"")+'>'+esc(c)+'</option>'; })).join("")+'</select></td>'+
    '<td><input type="text" class="mN" value="'+esc(i.name)+'" style="width:190px"></td>'+
    '<td><input type="text" class="mS" value="'+esc(i.spec||"")+'" style="width:150px"></td>'+
    '<td><input type="text" class="mU" value="'+esc(i.unit)+'" style="width:56px"></td>'+
    '<td><input type="number" class="mW" value="'+(i.price||0)+'" style="width:90px"></td>'+
    '<td><input type="number" class="mP" value="'+(i.step||1)+'" style="width:70px"></td>'+
    '<td style="text-align:center;"><input type="checkbox" class="mD" '+(i.discontinued?"checked":"")+(isProcurer()?"":" disabled title=\"발주 담당자만 변경할 수 있습니다\"")+' style="width:auto;"></td>'+
    '<td>'+(usage[i.id]||0)+'</td>'+
    '<td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm mSave" data-id="'+esc(i.id)+'">저장</button> '+
      '<button class="btn btn-danger btn-sm mDel" data-id="'+esc(i.id)+'">삭제</button></td></tr>'; }).join("")
    ||'<tr><td colspan="10" class="empty">검색 결과가 없습니다.</td></tr>';
  return {rows:rows,cnt:pool.length};
}

        '<div class="field"><label>단가(원)</label><input type="number" id="nW" value="0"></div>'+

function bindItemRowBtns(){
  document.querySelectorAll(".mSave").forEach(function(el){ el.onclick=async function(){
    var tr=el.closest("tr");
    var o={name:tr.querySelector(".mN").value.trim(),spec:tr.querySelector(".mS").value.trim(),
      unit:tr.querySelector(".mU").value.trim()||"EA",price:+tr.querySelector(".mW").value||0,
      category:tr.querySelector(".mC").value,
      step:Math.max(1,parseInt(tr.querySelector(".mP").value,10)||1)};
    var dchk=tr.querySelector(".mD"); if(dchk&&isProcurer()) o.discontinued=!!dchk.checked;
    if(!o.name){ alert("자재명을 입력하세요."); return; }
    if(await push(function(){ return db.from("items").update(o).eq("id",el.dataset.id); },"저장되었습니다.")){
      await pullItems(); render(); } }; });
  document.querySelectorAll(".mDel").forEach(function(el){ el.onclick=async function(){
    var used=S.stocks.filter(function(st){return st.itemId===el.dataset.id;}).length;
    if(!confirm("품목을 마스터에서 삭제합니다."+(used?"\n\n현재 "+used+"개 업체가 취급 중이며 해당 재고 정보도 삭제됩니다.":"")+"\n기존 로그·신청 이력은 유지됩니다.")) return;
    await push(function(){ return db.from("stocks").delete().eq("item_id",el.dataset.id); });
    if(await push(function(){ return db.from("items").delete().eq("id",el.dataset.id); },"삭제되었습니다.")){
      await pullItems(); await pull(); render(); } }; });
}
function bindItems(){
  var cs=document.getElementById("iCat");
  if(cs) cs.onchange=function(){ S.itmCat=cs.value; render(); };
  var se=document.getElementById("iSearch");
  if(se) se.oninput=function(){ S.itmSearch=se.value;
    var d=itemRowsData();
    var tb=document.getElementById("iBody"); if(tb) tb.innerHTML=d.rows;
    var c=document.getElementById("iCnt"); if(c) c.textContent=nf(d.cnt);
    bindItemRowBtns(); };
  bindItemRowBtns();
  var a=document.getElementById("nAdd");
  if(a) a.onclick=async function(){
    var code=document.getElementById("nC").value.trim();
    var n=document.getElementById("nN").value.trim();
    if(!n){ alert("자재명을 입력하세요."); return; }
    var id=code||uid();
    if(itemById(id)){ alert("이미 존재하는 자재번호입니다."); return; }
    var o={id:id,code:code,category:document.getElementById("nCat").value,
      name:n,spec:document.getElementById("nS").value.trim(),
      unit:document.getElementById("nU").value.trim()||"EA",
      price:+document.getElementById("nW").value||0,
      step:Math.max(1,parseInt(document.getElementById("nP").value,10)||1)};
    if(await push(function(){ return db.from("items").insert(M.itemOut(o)); },n+" 추가 완료")){
      S.msg.it=n+" 품목이 추가되었습니다."; await pullItems(); render(); } };
  var c=document.getElementById("csvItems");
  if(c) c.onclick=function(){ exportCSV("품목마스터",["자재번호","분류","자재명","규격","단위","단가","취급단위","사용업체수"],
    S.items.map(function(i){ return [i.code||i.id,i.category||"",i.name,i.spec||"",i.unit,i.price||0,i.step,
      S.stocks.filter(function(st){return st.itemId===i.id;}).length]; })); };
}

/* ══════════════════════════════════════════════════════════
   내보내기
   ══════════════════════════════════════════════════════════ */
function download(name,content,mime){
  try{
    var blob=new Blob(["\uFEFF"+content],{type:mime+";charset=utf-8;"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }catch(e){ alert("다운로드가 차단되었습니다. 브라우저 설정을 확인하세요."); }
}
/* 결재란이 포함된 업체별 부자재 신청서 (.xls) — Lv.2 이상 */
function exportRequestForm(){
  if(!lv(2)){ toast("권한이 없습니다.",true); return; }
  var co=curCo(), m=S.reqMonth;
  var mm=parseInt(m.split("-")[1],10);
  var rows=monthReqs(co).filter(function(r){ return finalQty(r)>0; })
    .map(function(r){ var it=itemById(r.itemId)||{}; return {r:r,it:it}; })
    .sort(function(a,b){ return (a.it.name||a.r.itemName).localeCompare(b.it.name||b.r.itemName,"ko"); });
  if(!rows.length){ toast(m+" 신청 내역이 없습니다.",true); return; }
  var d90=Date.now()-90*864e5;
  var today=new Date();
  var dateStr=today.getFullYear()+". "+String(today.getMonth()+1).padStart(2,"0")+". "+String(today.getDate()).padStart(2,"0");
  var td='border:.5pt solid #000;padding:4px 6px;font-size:10pt;vertical-align:middle;';
  var th=td+'background:#eeeeee;font-weight:bold;text-align:center;';
  var body=rows.map(function(x,idx){
    var r=x.r, it=x.it;
    var st=stockOf(co,r.itemId);
    var c90=S.logs.filter(function(l){ return l.type==="out"&&!l.void&&l.itemId===r.itemId&&l.company===co&&l.ts>=d90; })
      .reduce(function(sm,l){return sm+l.qty;},0);
    var avg=Math.round(c90/3);
    var basis=[];
    if(avg>0) basis.push("월평균 "+nf(avg)+(it.unit||"")+" 소모(90일 실측)");
    if(r.comment) basis.push(r.comment);
    return '<tr>'+
      '<td style="'+td+'text-align:center;">'+(idx+1)+'</td>'+
      '<td style="'+td+'text-align:center;mso-number-format:\'@\';">'+esc(it.code||r.itemId)+'</td>'+
      '<td style="'+td+'">'+esc(it.name||r.itemName)+(lineSeq(r.id)>1?' <span style="color:#c00000;font-size:9pt;">(추가)</span>':"")+'</td>'+
      '<td style="'+td+'">'+esc(it.spec||"")+'</td>'+
      '<td style="'+td+'text-align:right;">'+(st?nf(st.qty)+" "+esc(it.unit||""):"")+'</td>'+
      '<td style="'+td+'text-align:right;font-weight:bold;">'+nf(r.requestedQty||0)+" "+esc(it.unit||"")+'</td>'+
      '<td style="'+td+'">'+esc(basis.join(" / "))+'</td>'+
      '<td style="'+td+'text-align:right;color:#c00000;">'+(r.adjustedQty==null?"":nf(r.adjustedQty)+" "+esc(it.unit||""))+'</td>'+
      '</tr>';
  }).join("");
  var html='\uFEFF<html><head><meta charset="utf-8"></head><body>'+
    '<table style="border-collapse:collapse;width:760pt;">'+
    '<tr><td colspan="6" style="font-size:16pt;font-weight:bold;text-align:center;padding:8px;">('+esc(co)+') ('+mm+')월 부자재 신청서</td>'+
      '<td colspan="2" rowspan="2" style="vertical-align:top;">'+
        '<table style="border-collapse:collapse;margin-left:auto;">'+
        '<tr><td rowspan="2" style="'+td+'width:24pt;text-align:center;background:#eeeeee;font-weight:bold;">결<br>재</td>'+
            '<td style="'+td+'width:90pt;text-align:center;background:#eeeeee;font-weight:bold;height:20pt;">직책과장</td></tr>'+
        '<tr><td style="'+td+'height:48pt;"></td></tr>'+
        '</table></td></tr>'+
    '<tr><td colspan="6" style="text-align:right;font-size:10pt;padding:4px;">작성일 : '+dateStr+'</td></tr>'+
    '<tr>'+
      '<th style="'+th+'width:30pt;">순번</th><th style="'+th+'width:90pt;">자재번호</th>'+
      '<th style="'+th+'width:150pt;">품 명</th><th style="'+th+'width:150pt;">규 격</th>'+
      '<th style="'+th+'width:70pt;">현 재고량</th><th style="'+th+'width:70pt;">신청수량</th>'+
      '<th style="'+th+'width:150pt;">산출근거</th><th style="'+th+'width:80pt;">부서검토<br>(수량)</th></tr>'+
    body+'</table></body></html>';
  download("부자재신청서_"+co+"_"+m+".xls", html, "application/vnd.ms-excel");
}

function exportCSV(name,head,rows){
  if(!canExport()){ toast("데이터 내보내기 권한이 없습니다.",true); return; }
  var q=function(v){ var s=String(v==null?"":v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  download(name+"_"+new Date().toISOString().slice(0,10)+".csv",
    [head.map(q).join(",")].concat(rows.map(function(r){ return r.map(q).join(","); })).join("\r\n"),
    "text/csv");
}

/* ══════════════════════════════════════════════════════════

(async function main(){
  document.getElementById("app").innerHTML=
    '<div style="padding:70px;text-align:center;color:#5f7080;font-size:13px;">서버에서 불러오는 중…</div>';
  checkVersion();
  /* 로그인 세션이 있으면 프로필을 찾아 자동 로그인 */
  var prof=null;
  try{ prof=await currentProfile(); }catch(e){ console.error(e); }
  if(prof&&prof.status==="approved"){
    S.user=prof;
    var okItems=await pullItems();
    if(!okItems || !await pull()){
      var e=LAST_ERR||{};
      var raw=[e.message,e.hint,e.details,e.code].filter(Boolean).join(" | ")||"알 수 없는 오류";
      var t=raw.toLowerCase(), cause, fix;
      if(t.indexOf("invalid api key")>=0||t.indexOf("jwt")>=0||t.indexOf("401")>=0||t.indexOf("no api key")>=0){
        cause="API 키가 유효하지 않습니다 (401).";
        fix='<ul style="line-height:1.9;font-size:13.5px;"><li>Supabase <code>Project Settings → API</code>에서 <b>복사 버튼</b>으로 키를 다시 복사하세요.</li></ul>';
      } else if(t.indexOf("does not exist")>=0||t.indexOf("relation")>=0||t.indexOf("schema cache")>=0||t.indexOf("pgrst")>=0||t.indexOf("function")>=0){
        cause="데이터베이스가 v6 인증 구조로 준비되지 않았습니다.";
        fix='<ul style="line-height:1.9;font-size:13.5px;"><li>Supabase <code>SQL Editor</code>에서 <code>supabase_v7_auth.sql</code>을 실행하세요.</li></ul>';
      } else if(t.indexOf("row-level security")>=0||t.indexOf("policy")>=0||t.indexOf("permission")>=0){
        cause="접근 권한 규칙에 막혔습니다.";
        fix='<ul style="line-height:1.9;font-size:13.5px;"><li><code>supabase_v7_auth.sql</code>이 실행되었는지, 이 계정이 승인 상태인지 확인하세요.</li></ul>';
      } else if(t.indexOf("failed to fetch")>=0||t.indexOf("networkerror")>=0){
        cause="서버 주소에 접속하지 못했습니다.";
        fix='<ul style="line-height:1.9;font-size:13.5px;"><li><code>SUPABASE_URL</code> 형식을 확인하세요. 사내망 차단 가능성도 있습니다.</li></ul>';
      } else { cause="예상하지 못한 오류입니다."; fix='<ul style="line-height:1.9;font-size:13.5px;"><li>아래 오류 내용을 그대로 전달해 주세요.</li></ul>'; }
      setupScreen("서버에 연결하지 못했습니다",
        '<p style="line-height:1.7;font-size:14px;"><b>'+cause+'</b></p>'+fix+
        '<div style="margin:16px 0;padding:12px;background:#f3f6f8;border-left:3px solid #d1462f;border-radius:3px;font-family:IBM Plex Mono;font-size:12px;word-break:break-all;color:#485663;">'+
        String(raw).replace(/</g,"&lt;")+'</div>'+
        '<button class="btn btn-primary" onclick="location.reload()">다시 시도</button> '+
        '<button class="btn btn-ghost" id="setupOut">로그아웃</button>');
      var so=document.getElementById("setupOut"); if(so) so.onclick=async function(){ await signOutAll(); location.reload(); };
      return;
    }
    startPoll();
  } else if(prof&&prof.status==="pending"){
    S.pendInfo=prof;
  } else if(prof&&prof.status==="suspended"){
    await signOutAll(); S.authMsg={t:"e",m:"정지된 계정입니다."};
  }
  render();
  setInterval(function(){ if(!S.user) checkVersion(); },180000);
})();
})();
