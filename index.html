<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부자재 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#e8edf1; --panel:#fff; --panel-alt:#f3f6f8;
    --navy:#0d2436; --navy-2:#173a52; --steel-line:#c9d3db;
    --accent:#ff6a1a; --accent-dark:#e35a0d;
    --text:#182430; --text-mute:#5f7080;
    --danger:#d1462f; --warn:#c98a12; --ok:#28925a; --info:#2b6cb0;
    --r:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;font-size:14px;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy) 42%,var(--bg) 42%);}
  .auth-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--steel-line);
    border-radius:var(--r);box-shadow:0 14px 44px rgba(13,36,54,.28);overflow:hidden;}
  .auth-head{background:var(--navy);color:#fff;padding:22px 24px 18px;border-bottom:4px solid var(--accent);}
  .auth-head .eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;color:var(--accent);margin-bottom:6px;}
  .auth-head h1{margin:0;font-size:20px;font-weight:700;}
  .auth-head p{margin:6px 0 0;font-size:12.5px;color:#b9c8d4;line-height:1.5;}
  .auth-tabs{display:flex;border-bottom:1px solid var(--steel-line);}
  .auth-tab{flex:1;text-align:center;padding:13px;font-size:13.5px;font-weight:600;cursor:pointer;
    color:var(--text-mute);background:var(--panel-alt);}
  .auth-tab.active{color:var(--navy);background:var(--panel);box-shadow:inset 0 -3px 0 var(--accent);}
  .auth-body{padding:22px 24px 26px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-mute);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--steel-line);border-radius:var(--r);
    font-size:15px;font-family:inherit;background:#fff;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  input:disabled,select:disabled{background:#eef1f4;color:#8b99a5;}
  .hint{font-size:11.5px;color:var(--text-mute);margin-top:6px;line-height:1.55;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;
    border-radius:var(--r);border:1px solid transparent;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--accent-dark);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-navy:hover:not(:disabled){background:var(--navy-2);}
  .btn-block{width:100%;}
  .btn-ghost{background:#fff;border-color:var(--steel-line);color:var(--text);}
  .btn-ghost:hover:not(:disabled){background:var(--panel-alt);}
  .btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover:not(:disabled){background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .msg{padding:10px 12px;border-radius:var(--r);font-size:12.8px;margin-bottom:14px;line-height:1.55;}
  .msg-error{background:#fbe9e6;color:var(--danger);border:1px solid #f3c6bd;}
  .msg-ok{background:#e8f5ee;color:var(--ok);border:1px solid #bfe3cd;}
  .msg-warn{background:#fdf4e3;color:#8a6410;border:1px solid #edd9a8;}
  .msg-info{background:#e8f0f9;color:var(--info);border:1px solid #c2d6ec;}

  .topbar{background:var(--navy);color:#fff;padding:0 16px;display:flex;align-items:center;
    justify-content:space-between;height:56px;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  .brand .mark{width:30px;height:30px;background:var(--accent);border-radius:2px;display:flex;
    align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-weight:700;font-size:12px;color:#0d2436;flex:none;}
  .brand .name{font-weight:700;font-size:14.5px;line-height:1.15;}
  .brand .name span{color:#9fb4c4;font-weight:400;font-size:11px;display:block;margin-top:2px;}
  .who{display:flex;align-items:center;gap:9px;flex:none;}
  .lvbadge{font-family:'IBM Plex Mono';font-size:10.5px;font-weight:700;color:#0d2436;background:var(--accent);
    padding:3px 6px;border-radius:2px;}
  .who .u{font-size:12px;color:#dbe6ee;}
  .who .u b{color:#fff;}
  @media(max-width:900px){.who .u{display:none;}.brand .name span{display:none;}}

  .tabs{display:flex;gap:2px;background:var(--navy-2);padding:0 12px;overflow-x:auto;
    position:sticky;top:56px;z-index:19;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabbtn{padding:11px 13px;font-size:12.8px;font-weight:600;color:#b9cbd8;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap;}
  .tabbtn.active{color:#fff;border-bottom-color:var(--accent);}
  .tabbtn .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;
    background:var(--danger);color:#fff;border-radius:8px;font-size:10px;margin-left:4px;padding:0 4px;font-family:'IBM Plex Mono';}

  main{flex:1;padding:18px 16px 70px;max-width:1200px;width:100%;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--steel-line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;}
  .panel-head{padding:13px 16px;border-bottom:1px solid var(--steel-line);background:var(--panel-alt);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .panel-head h2{margin:0;font-size:14.5px;font-weight:700;}
  .panel-head .sub{font-size:11.5px;color:var(--text-mute);margin-top:3px;line-height:1.5;}
  .panel-body{padding:16px;}

  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th{text-align:left;font-size:11px;color:var(--text-mute);padding:9px 10px;
    border-bottom:1px solid var(--steel-line);background:var(--panel-alt);font-weight:600;white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid #eef1f4;font-family:'IBM Plex Mono',monospace;font-size:12.5px;vertical-align:middle;}
  td.kr{font-family:'IBM Plex Sans KR';}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fbfcfd;}
  td input,td select{padding:6px 7px;font-size:13px;}

  .tag{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono';white-space:nowrap;}
  .t-out{background:#fbe9e6;color:var(--danger);}
  .t-in{background:#e8f5ee;color:var(--ok);}
  .t-ret{background:#e8f0f9;color:var(--info);}
  .t-adj{background:#efe9f7;color:#6b46a8;}
  .t-can{background:#eceff2;color:#5f7080;}
  .t-ok{background:#e8f5ee;color:var(--ok);}
  .t-warn{background:#fdf3de;color:var(--warn);}
  .t-danger{background:#fbe9e6;color:var(--danger);}
  .t-pend{background:#fdf3de;color:var(--warn);}
  .t-grey{background:#eceff2;color:#5f7080;}
  .lvchip{display:inline-block;padding:2px 8px;border-radius:2px;font-family:'IBM Plex Mono';
    font-size:11px;font-weight:700;color:#fff;}
  .lv1{background:#7b8b99;} .lv2{background:#2b6cb0;} .lv3{background:#c98a12;} .lv4{background:#0d2436;}

  .gauge{width:100%;min-width:80px;height:8px;background:#e3e8ec;border-radius:4px;overflow:hidden;}
  .gauge-fill{height:100%;background:var(--ok);}
  .gauge-fill.warn{background:var(--warn);}
  .gauge-fill.danger{background:var(--danger);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:700px){.grid3{grid-template-columns:1fr 1fr;}}
  .statcard{background:var(--panel);border:1px solid var(--steel-line);border-radius:var(--r);padding:13px 15px;}
  .statcard .lbl{font-size:11px;color:var(--text-mute);font-weight:600;}
  .statcard .val{font-family:'IBM Plex Mono';font-size:24px;font-weight:700;margin-top:4px;color:var(--navy);}
  .statcard .val small{font-size:12px;color:var(--text-mute);font-weight:500;}

  .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .form-row .field{flex:1;min-width:150px;margin-bottom:0;}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .filters select,.filters input{width:auto;flex:1;min-width:120px;padding:8px 9px;font-size:13px;}
  .empty{padding:30px;text-align:center;color:var(--text-mute);font-size:13px;font-family:'IBM Plex Sans KR';}
  .idtag{font-family:'IBM Plex Mono';background:var(--panel-alt);border:1px solid var(--steel-line);
    padding:1px 6px;border-radius:2px;font-size:11.5px;}
  .footer-note{font-size:11px;color:var(--text-mute);text-align:center;padding:16px 0 34px;}

  .cobar{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;
    padding:10px 14px;border-radius:var(--r);margin-bottom:16px;flex-wrap:wrap;}
  .cobar label{font-size:12px;color:#9fb4c4;font-weight:600;}
  .cobar select{width:auto;min-width:180px;padding:7px 10px;font-size:13.5px;font-weight:600;}
  .cobar .now{font-family:'IBM Plex Mono';font-size:12px;color:#9fb4c4;}

  .picker{border:1px solid var(--steel-line);border-radius:var(--r);overflow:hidden;}
  .picker-search{padding:9px;border-bottom:1px solid var(--steel-line);background:var(--panel-alt);}
  .picker-list{max-height:240px;overflow-y:auto;}
  .pitem{padding:10px 12px;border-bottom:1px solid #eef1f4;cursor:pointer;display:flex;
    align-items:center;justify-content:space-between;gap:10px;}
  .pitem:hover{background:#fbfcfd;}
  .pitem.sel{background:#fff4ec;box-shadow:inset 3px 0 0 var(--accent);}
  .pitem .nm{font-size:13.5px;font-weight:500;}
  .pitem .st{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-mute);white-space:nowrap;}
  .fav{font-size:10.5px;color:var(--accent);font-weight:700;margin-left:6px;}

  .qty-box{border:1px solid var(--steel-line);border-radius:var(--r);padding:14px;background:var(--panel-alt);}
  .qty-display{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .qty-display input{font-family:'IBM Plex Mono';font-size:30px;font-weight:700;text-align:right;
    padding:8px 12px;height:56px;background:#fff;}
  .qty-unit{font-family:'IBM Plex Mono';font-size:15px;color:var(--text-mute);font-weight:600;min-width:44px;}
  .qty-rows{display:flex;flex-direction:column;gap:7px;}
  .qty-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  .qbtn{padding:11px 4px;border:1px solid var(--steel-line);background:#fff;border-radius:var(--r);
    font-family:'IBM Plex Mono';font-size:14px;font-weight:600;cursor:pointer;color:var(--navy);}
  .qbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .qbtn.minus{color:var(--danger);}
  .qbtn.minus:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
  .qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .qchip{padding:7px 12px;border:1px solid var(--accent);color:var(--accent-dark);background:#fff;
    border-radius:20px;font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;cursor:pointer;}
  .qchip:hover{background:var(--accent);color:#fff;}
  .qclear{padding:7px 12px;border:1px solid var(--steel-line);color:var(--text-mute);background:#fff;
    border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .qty-meta{font-size:11.5px;color:var(--text-mute);margin-top:9px;line-height:1.55;}

  .seg{display:flex;border:1px solid var(--steel-line);border-radius:var(--r);overflow:hidden;width:fit-content;}
  .segbtn{padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-mute);border-right:1px solid var(--steel-line);}
  .segbtn:last-child{border-right:none;}
  .segbtn.on{background:var(--navy);color:#fff;}

  .syncdot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#9fb4c4;font-family:'IBM Plex Mono';}
  .syncdot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;}
  .syncdot.busy i{background:var(--warn);}
  .syncdot.err i{background:var(--danger);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 18px;border-radius:4px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:90%;}
  .toast.err{background:var(--danger);}
  .setup{max-width:700px;margin:50px auto;background:#fff;border:1px solid var(--steel-line);padding:28px;border-radius:var(--r);}
  .setup h1{font-size:19px;margin:0 0 12px;}
  .setup code{background:#f3f6f8;padding:2px 6px;border-radius:2px;font-family:'IBM Plex Mono';font-size:13px;}
  .setup pre{background:#0d2436;color:#e8edf1;padding:14px;border-radius:3px;overflow-x:auto;font-size:12.5px;font-family:'IBM Plex Mono';}
  .chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--steel-line);
    border-radius:var(--r);cursor:pointer;background:#fff;}
  .chk input{width:auto;}
  .chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
  .pendbox{border:1px solid var(--steel-line);border-radius:var(--r);overflow:hidden;}
  .pendrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 13px;border-bottom:1px solid #eef1f4;font-size:13px;}
  .pendrow.last{border-bottom:none;background:#fdf9f0;}
  .pendrow span{color:var(--text-mute);font-size:12px;font-weight:600;}
  .pendrow b{font-weight:600;text-align:right;}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  ::placeholder{color:#9aa9b6;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   ▼▼▼  여기 두 줄만 본인 것으로 바꾸세요  ▼▼▼
   Supabase → Project Settings → API
   ══════════════════════════════════════════════════════════════ */
const SUPABASE_URL      = "https://mmmyzlplgemewjhapwwk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbXl6bHBsZ2VtZXdqaGFwd3drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQwMjAsImV4cCI6MjEwMjM2MDAyMH0.tSloDZIat5jcp2h_BaqYye4zWDcoI-X1og4EnsGwyRA";
/* ══════════════════════════════════════════════════════════════
   ▲▲▲  나머지는 건드리지 마세요  ▲▲▲
   ══════════════════════════════════════════════════════════════ */

(function(){
"use strict";

/* ── 기준 정보 ────────────────────────────────────────────── */
const DEPT = "멤브레인공사부";
const VENDORS = ["진영","창성","비스코","DHI","I-Tec","HSG","장비팀"];
const COMPANIES = [DEPT].concat(VENDORS);
const LEVEL_NAME = {1:"부자재 수령자",2:"업체 공구장",3:"관리자",4:"총관리자"};
const LEVEL_DESC = {
  1:"등록된 품목을 불출(차감)만 할 수 있습니다.",
  2:"소속 업체의 입고·반납, 익월 신청, 긴급 신청까지 가능합니다.",
  3:"전 업체 관리, 신청 수량 조정, 데이터 내보내기가 가능합니다.",
  4:"품목 마스터 관리와 권한 부여 권한을 가집니다."
};

const CFG_URL = String(SUPABASE_URL).replace(/[\s"'`]/g,"").replace(/\/+$/,"");
const CFG_KEY = String(SUPABASE_ANON_KEY).replace(/[\s"'`]/g,"");

function setupScreen(title, body){
  document.getElementById("app").innerHTML = '<div class="setup"><h1>'+title+'</h1>'+body+'</div>';
}
if(CFG_URL.indexOf("http")!==0 || CFG_KEY.length<20){
  setupScreen("서버 연결 설정이 필요합니다",
    '<p style="line-height:1.7;font-size:13.5px;">파일 상단 두 줄을 Supabase 값으로 바꾼 뒤 다시 업로드하세요.</p>'+
    '<pre>const SUPABASE_URL      = "https://xxxx.supabase.co";\nconst SUPABASE_ANON_KEY = "eyJhbGciOi...";</pre>'+
    '<p style="font-size:13px;color:#5f7080;">현재 인식 — URL <code>'+(CFG_URL||"(비어 있음)")+'</code> · KEY <code>'+CFG_KEY.length+'</code>자</p>');
  return;
}
const db = window.supabase.createClient(CFG_URL, CFG_KEY);
let LAST_ERR = null;

/* ── 상태 ─────────────────────────────────────────────────── */
let S = {
  user:null, tab:"dash", authTab:"login", authMsg:null, pendInfo:null,
  users:[], items:[], stocks:[], logs:[], requests:[], emergencies:[], stocktakes:[],
  co:null,                       /* 현재 보고 있는 업체 */
  reqMonth:nextMonth(),
  wMode:"out", wItem:null, wQty:0, wSearch:"", wMsg:null, wTeam:"",
  logFilter:{item:"",team:"",type:"",from:"",to:""},
  sync:"ok", lastSync:0, msg:{}
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nf(n){ return Number(n||0).toLocaleString("ko-KR"); }
function nextMonth(){ var d=new Date(); d.setMonth(d.getMonth()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function nowLocal(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16); }
function fmt(ts,short){ var d=new Date(Number(ts));
  return short?d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})
              :d.toLocaleString("ko-KR"); }
function toast(m,err){ var t=document.createElement("div");
  t.className="toast"+(err?" err":""); t.textContent=m; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },3200); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k);
  if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }

/* ── 권한 ─────────────────────────────────────────────────── */
function lv(n){ return S.user && S.user.level>=n; }
function isDept(){ return S.user && S.user.company===DEPT; }
/* Lv.3 이상은 모든 업체 조회/조작, Lv.1~2는 자기 업체만 */
function canPickCompany(){ return lv(3); }
function myCompany(){ return isDept()? VENDORS[0] : S.user.company; }
function curCo(){ return canPickCompany() ? (S.co||myCompany()) : S.user.company; }
function canExport(){ return lv(3); }          /* 데이터 내보내기: Lv.3 이상 */
function canAddStock(){ return lv(2); }        /* 재고 증가(입고/반납): Lv.2 이상 */
function canRequest(){ return lv(2); }         /* 익월 신청·긴급 신청: Lv.2 이상 */
function canManageItems(){ return lv(4); }     /* 품목 마스터: Lv.4 전용 */
function canGrant(){ return lv(4); }           /* 권한 부여: Lv.4 전용 */

/* ── DB 매핑 ──────────────────────────────────────────────── */

function setSync(v){ S.sync=v; var el=document.getElementById("syncDot");
  if(el) el.className="syncdot"+(v==="busy"?" busy":v==="err"?" err":""); }

async function pull(){
  setSync("busy");
  try{
    var res = await Promise.all([
      db.from("users").select("*"),
      db.from("items").select("*").order("name"),
      db.from("stocks").select("*"),
      db.from("logs").select("*").order("ts",{ascending:false}).limit(5000),
      db.from("requests").select("*"),
      db.from("emergencies").select("*").order("ts",{ascending:false}),
      db.from("stocktakes").select("*").order("ts",{ascending:false})
    ]);
    for(var i=0;i<res.length;i++){ if(res[i].error) throw res[i].error; }
    S.users=(res[0].data||[]).map(M.userIn);
    S.items=(res[1].data||[]).map(M.itemIn);
    S.stocks=(res[2].data||[]).map(M.stockIn);
    S.logs=(res[3].data||[]).map(M.logIn);
    S.requests=(res[4].data||[]).map(M.reqIn);
    S.emergencies=(res[5].data||[]).map(M.emgIn);
    S.stocktakes=(res[6].data||[]).map(M.stkIn);
    if(S.user){ var me=S.users.filter(function(x){return x.id===S.user.id;})[0]; if(me) S.user=me; }
    S.lastSync=Date.now(); setSync("ok"); LAST_ERR=null; return true;
  }catch(err){
    console.error(err); setSync("err"); LAST_ERR=err;
    toast("서버 연결에 실패했습니다.",true);
    return false;
  }
}

async function push(fn,okMsg){
  setSync("busy");
  try{ var res=await fn(); if(res&&res.error) throw res.error;
    setSync("ok"); if(okMsg) toast(okMsg); return res||{ok:true}; }
  catch(err){ console.error(err); setSync("err");
    toast("저장 실패: "+(err.message||"서버 오류"),true); return null; }
}

/* ── 조회 헬퍼 ────────────────────────────────────────────── */
function itemById(id){ return S.items.filter(function(i){return i.id===id;})[0]; }
function stockKey(co,itemId){ return co+"|"+itemId; }
function stockOf(co,itemId){ return S.stocks.filter(function(s){return s.id===stockKey(co,itemId);})[0]; }
/* 해당 업체가 실제로 취급 등록한 품목만 */
function itemsOf(co){
  return S.stocks.filter(function(s){return s.company===co;})
    .map(function(s){ var it=itemById(s.itemId); return it?{item:it,stock:s}:null; })
    .filter(Boolean)
    .sort(function(a,b){ return a.item.name.localeCompare(b.item.name,"ko"); });
}
function lowOf(co){ return itemsOf(co).filter(function(x){
  return x.stock.minQty>0 && x.stock.qty<=x.stock.minQty; }); }

function bindAuth(){
  var back=document.getElementById("pdBack");
  if(back) back.onclick=function(){ S.pendInfo=null; S.authMsg=null; render(); };
  var recheck=document.getElementById("pdCheck");
  if(recheck) recheck.onclick=async function(){
    recheck.disabled=true; recheck.textContent="확인 중…";
    await pull();
    var u=S.users.filter(function(x){ return x.id===S.pendInfo.id; })[0];
    if(!u){ S.pendInfo=null; S.authMsg={t:"e",m:"계정 신청이 거절되어 삭제되었습니다. 다시 신청해 주세요."}; return render(); }
    if(u.status==="approved"){
      S.pendInfo=null;
      S.authMsg={t:"o",m:"권한이 부여되었습니다. Lv."+u.level+" · "+LEVEL_NAME[u.level]+" 로 로그인하세요."};
      return render();
    }
    if(u.status==="suspended"){ S.pendInfo=null; S.authMsg={t:"e",m:"정지된 계정입니다."}; return render(); }
    S.pendInfo=u; toast("아직 권한이 부여되지 않았습니다."); render();
  };

  document.querySelectorAll("[data-at]").forEach(function(el){
    el.onclick=function(){ S.authTab=el.dataset.at; S.authMsg=null; render(); }; });

  var lvSel=document.getElementById("su_lv");
  if(lvSel) lvSel.onchange=function(){
    document.getElementById("lvHint").textContent=LEVEL_DESC[+lvSel.value]; };

  var f=document.getElementById("fLogin");
  if(f) f.onsubmit=async function(e){
    e.preventDefault();
    var id=document.getElementById("li_id").value.trim();
    var pw=document.getElementById("li_pw").value;
    await pull();
    var u=S.users.filter(function(x){return x.id===id;})[0];
    if(!u){ S.authMsg={t:"e",m:"등록되지 않은 아이디입니다."}; return render(); }
    if(u.status==="pending"){ S.pendInfo=u; S.authMsg=null; return render(); }
    if(u.status==="suspended"){ S.authMsg={t:"e",m:"정지된 계정입니다."}; return render(); }
    if(u.pass!==pw){ S.authMsg={t:"e",m:"비밀번호가 일치하지 않습니다."}; return render(); }
    u.lastLogin=Date.now();
    await push(function(){ return db.from("users").upsert(M.userOut(u)); });
    S.user=u; S.authMsg=null; S.tab="dash"; S.co=null; ls("bz_session",u.id);
    render(); startPoll();
  };

  var g=document.getElementById("fSignup");
  if(g) g.onsubmit=async function(e){
    e.preventDefault();
    var co=document.getElementById("su_co").value;
    var nm=document.getElementById("su_nm").value.trim();
    var no=document.getElementById("su_no").value.trim();
    var pw=document.getElementById("su_pw").value;
    var pw2=document.getElementById("su_pw2").value;
    var rl=+document.getElementById("su_lv").value;
    if(!nm||!no){ S.authMsg={t:"e",m:"이름과 사번을 입력하세요."}; return render(); }
    if(pw.length<4){ S.authMsg={t:"e",m:"비밀번호는 4자 이상이어야 합니다."}; return render(); }
    if(pw!==pw2){ S.authMsg={t:"e",m:"비밀번호가 서로 다릅니다."}; return render(); }
    await pull();
    var id=no;
    var dup=S.users.filter(function(u){return u.id===id;})[0];
    if(dup){
      S.authMsg={t:"e",m:"이미 등록된 사번입니다 ("+id+" · "+dup.company+" "+dup.name+"). 사번을 다시 확인하세요."};
      return render(); }
    var first=S.users.length===0;
    var u={id:id,pass:pw,name:nm,company:co,level:first?4:1,reqLevel:first?4:rl,
      status:first?"approved":"pending",createdAt:Date.now(),lastLogin:0};
    if(!await push(function(){ return db.from("users").insert(M.userOut(u)); })) return;
    if(first && S.items.length===0){
      await push(function(){ return db.from("items").insert(seedItems().map(M.itemOut)); });
    }
    if(first){
      S.authTab="login";
      S.authMsg={t:"o",m:"최초 가입자이므로 총관리자(Lv.4)로 자동 승인되었습니다. 아이디: "+id};
    } else {
      S.pendInfo=u; S.authMsg=null;
    }
    render();
  };
}

function stepsFor(it){ var s=it.step||1; return [s,s*10].filter(function(v,i,a){return a.indexOf(v)===i;}); }
function presetsFor(it){ var s=it.step||1; return [s*5,s*10,s*25,s*50]; }
function recentItemIds(){
  var out=[];
  for(var i=0;i<S.logs.length;i++){ var l=S.logs[i];
    if(l.by===S.user.id&&l.type==="out"&&out.indexOf(l.itemId)<0) out.push(l.itemId);
    if(out.length>=5) break; }
  return out;
}
function knownTeams(){
  var seen={},out=[];
  S.logs.forEach(function(l){ if(l.team&&!seen[l.team]){ seen[l.team]=1; out.push(l.team); } });
  return out.slice(0,40);
}

    return a.item.name.localeCompare(b.item.name,"ko"); });

    '<div class="field"><label>1. 품목 선택</label>'+
      '<div class="picker"><div class="picker-search">'+

      '<div class="picker-list">'+(pool.map(function(x){

          '<span class="qty-unit">'+esc(it.unit)+'</span></div>'+

  '</div></div>';
}

function bindWithdraw(){
  document.querySelectorAll("[data-mode]").forEach(function(el){
    el.onclick=function(){ S.wMode=el.dataset.mode; S.wMsg=null; render(); }; });
  var se=document.getElementById("wSearch");
  if(se) se.oninput=function(){ S.wSearch=se.value; var p=se.selectionStart; render();
    var n=document.getElementById("wSearch"); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  document.querySelectorAll("[data-pick]").forEach(function(el){
    el.onclick=function(){ S.wItem=el.dataset.pick; S.wQty=0; S.wMsg=null; render(); }; });
  var q=document.getElementById("wQty");
  if(q){ q.oninput=function(){ S.wQty=Math.max(0,parseInt(q.value,10)||0);
    var b=document.getElementById("wSubmit"); if(b) b.disabled=!S.wQty; };
    q.onblur=function(){ render(); }; }
  document.querySelectorAll("[data-add]").forEach(function(el){
    el.onclick=function(){ S.wQty=Math.max(0,(S.wQty||0)+(+el.dataset.add)); render(); }; });
  document.querySelectorAll("[data-set]").forEach(function(el){
    el.onclick=function(){ S.wQty=+el.dataset.set; render(); }; });
  var tm=document.getElementById("wTeam"); if(tm) tm.oninput=function(){ S.wTeam=tm.value; };

  var sub=document.getElementById("wSubmit");
  if(sub) sub.onclick=async function(){
    var co=curCo(), it=itemById(S.wItem);
    if(!it||!S.wQty) return;
    if(S.wMode!=="out" && !canAddStock()){ toast("재고를 늘리는 권한이 없습니다.",true); return; }
    var taker=document.getElementById("wTaker").value.trim();
    var team=document.getElementById("wTeam").value.trim();
    var tv=document.getElementById("wTime").value;
    if(!taker||(!team&&S.wMode==="out")){
      S.wMsg={t:"e",m:"담당자와 작업팀은 반드시 입력해야 합니다."}; return render(); }
    var qty=S.wQty, mode=S.wMode, delta=(mode==="out"?-qty:qty);
    sub.disabled=true; sub.textContent="저장 중…";
    var log={id:uid(),ts:tv?new Date(tv).getTime():Date.now(),type:mode,company:co,
      itemId:it.id,itemName:it.name,unit:it.unit,qty:qty,taker:taker,team:team||"-",
      by:S.user.id,byName:S.user.name};
    var r=await push(function(){ return db.rpc("apply_stock_movement",
      {p_log:M.logOut(log),p_company:co,p_item_id:it.id,p_delta:delta}); });
    if(!r){ S.wMsg={t:"e",m:"저장에 실패했습니다. 다시 시도해 주세요."}; return render(); }
    await pull();
    var cur=stockOf(co,it.id);
    S.wMsg={t:"o",m:it.name+" "+nf(qty)+it.unit+" "+({out:"불출",in:"입고",ret:"반납"}[mode])+
      " 완료 · "+co+" 보유량 "+nf(cur?cur.qty:0)+it.unit};
    S.wQty=0; S.wTeam=team; render();
  };
}

function bindStk(){
  var co=curCo();
  document.querySelectorAll(".sk").forEach(function(el){ el.oninput=function(){
    var st=stockOf(co,el.dataset.id);
    var cell=document.querySelector('.skdiff[data-id="'+el.dataset.id+'"]');
    if(el.value===""){ cell.textContent="-"; cell.style.color="var(--text-mute)"; return; }
    var d=(parseInt(el.value,10)||0)-st.qty;
    cell.textContent=(d>0?"+":"")+nf(d);
    cell.style.color=d<0?"var(--danger)":d>0?"var(--info)":"var(--ok)"; }; });

  var b=document.getElementById("skSave");
  if(b) b.onclick=async function(){
    var lines=[];
    document.querySelectorAll(".sk").forEach(function(el){
      if(el.value==="") return;
      var it=itemById(el.dataset.id), st=stockOf(co,el.dataset.id);
      var real=parseInt(el.value,10)||0;
      lines.push({itemId:it.id,itemName:it.name,system:st.qty,real:real,diff:real-st.qty,unit:it.unit});
    });
    if(!lines.length){ alert("실물 수량을 하나 이상 입력하세요."); return; }
    if(!confirm(co+"의 "+lines.length+"개 품목 보유량을 실사값으로 보정합니다. 진행할까요?")) return;
    b.disabled=true; b.textContent="처리 중…";
    var note=document.getElementById("skNote").value.trim();
    for(var i=0;i<lines.length;i++){
      var l=lines[i];
      if(l.diff!==0){
        var lg={id:uid(),ts:Date.now(),type:"adj",company:co,itemId:l.itemId,itemName:l.itemName,
          unit:l.unit,qty:Math.abs(l.diff),taker:S.user.name,
          team:"실사보정 "+(l.diff>0?"+":"")+l.diff,by:S.user.id,byName:S.user.name};
        await push((function(lg,l){ return function(){ return db.rpc("apply_stock_movement",
          {p_log:M.logOut(lg),p_company:co,p_item_id:l.itemId,p_delta:l.diff}); }; })(lg,l));
      }
    }
    await push(function(){ return db.from("stocktakes").insert(M.stkOut({id:uid(),ts:Date.now(),
      company:co,by:S.user.id,byName:S.user.name,note:note,lines:lines,
      total:lines.reduce(function(s,l){return s+l.diff;},0)})); },"실사가 확정되었습니다.");
    S.msg.stk="실사가 확정되고 보유량이 보정되었습니다.";
    await pull(); render();
  };

  var c=document.getElementById("csvStk");
  if(c) c.onclick=function(){ var rows=[];
    S.stocktakes.forEach(function(s){ s.lines.forEach(function(l){
      rows.push([fmt(s.ts),s.company||"",s.byName,l.itemName,l.system,l.real,l.diff,s.note||""]); }); });
    exportCSV("재고실사",["일시","업체","실사자","품목","시스템재고","실물수량","차이","메모"],rows); };

    var a=document.getElementById("pw1").value, c=document.getElementById("pw2").value;
    if(a.length<4){ alert("4자 이상 입력하세요."); return; }
    if(a!==c){ alert("두 비밀번호가 일치하지 않습니다."); return; }

      S.msg.me="비밀번호가 변경되었습니다."; await pull(); render(); } };
  var k=document.getElementById("bkup");
  if(k) k.onclick=function(){ download("부자재백업_"+new Date().toISOString().slice(0,10)+".json",
    JSON.stringify({exportedAt:new Date().toISOString(),users:S.users,items:S.items,stocks:S.stocks,
      logs:S.logs,requests:S.requests,emergencies:S.emergencies,stocktakes:S.stocktakes},null,2),
    "application/json"); };
}

/* ══════════════════════════════════════════════════════════
   내보내기
   ══════════════════════════════════════════════════════════ */
function download(name,content,mime){
  try{
    var blob=new Blob(["\uFEFF"+content],{type:mime+";charset=utf-8;"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }catch(e){ alert("다운로드가 차단되었습니다. 브라우저 설정을 확인하세요."); }
}
function exportCSV(name,head,rows){
  if(!canExport()){ toast("데이터 내보내기 권한이 없습니다.",true); return; }
  var q=function(v){ var s=String(v==null?"":v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  download(name+"_"+new Date().toISOString().slice(0,10)+".csv",
    [head.map(q).join(",")].concat(rows.map(function(r){ return r.map(q).join(","); })).join("\r\n"),
    "text/csv");
}
