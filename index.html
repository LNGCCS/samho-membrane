<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부자재 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#e8edf1; --panel:#fff; --panel-alt:#f3f6f8;
    --navy:#0d2436; --navy-2:#173a52; --steel-line:#c9d3db;
    --accent:#ff6a1a; --accent-dark:#e35a0d;
    --text:#182430; --text-mute:#5f7080;
    --danger:#d1462f; --warn:#c98a12; --ok:#28925a; --info:#2b6cb0;
    --r:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;font-size:14px;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy) 42%,var(--bg) 42%);}
  .auth-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--steel-line);
    border-radius:var(--r);box-shadow:0 14px 44px rgba(13,36,54,.28);overflow:hidden;}
  .auth-head{background:var(--navy);color:#fff;padding:22px 24px 18px;border-bottom:4px solid var(--accent);}
  .auth-head .eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;color:var(--accent);margin-bottom:6px;}
  .auth-head h1{margin:0;font-size:20px;font-weight:700;}
  .auth-head p{margin:6px 0 0;font-size:12.5px;color:#b9c8d4;line-height:1.5;}
  .auth-tabs{display:flex;border-bottom:1px solid var(--steel-line);}
  .auth-tab{flex:1;text-align:center;padding:13px;font-size:13.5px;font-weight:600;cursor:pointer;
    color:var(--text-mute);background:var(--panel-alt);}
  .auth-tab.active{color:var(--navy);background:var(--panel);box-shadow:inset 0 -3px 0 var(--accent);}
  .auth-body{padding:22px 24px 26px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-mute);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--steel-line);border-radius:var(--r);
    font-size:15px;font-family:inherit;background:#fff;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  input:disabled,select:disabled{background:#eef1f4;color:#8b99a5;}
  .hint{font-size:11.5px;color:var(--text-mute);margin-top:6px;line-height:1.55;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;
    border-radius:var(--r);border:1px solid transparent;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--accent-dark);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-block{width:100%;}
  .btn-ghost{background:#fff;border-color:var(--steel-line);color:var(--text);}
  .btn-ghost:hover:not(:disabled){background:var(--panel-alt);}
  .btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover:not(:disabled){background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .msg{padding:10px 12px;border-radius:var(--r);font-size:12.8px;margin-bottom:14px;line-height:1.55;}
  .msg-error{background:#fbe9e6;color:var(--danger);border:1px solid #f3c6bd;}
  .msg-ok{background:#e8f5ee;color:var(--ok);border:1px solid #bfe3cd;}
  .msg-warn{background:#fdf4e3;color:#8a6410;border:1px solid #edd9a8;}
  .msg-info{background:#e8f0f9;color:var(--info);border:1px solid #c2d6ec;}

  .topbar{background:var(--navy);color:#fff;padding:0 16px;display:flex;align-items:center;
    justify-content:space-between;height:56px;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  .brand .mark{width:30px;height:30px;background:var(--accent);border-radius:2px;display:flex;
    align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-weight:700;font-size:12px;color:#0d2436;flex:none;}
  .brand .name{font-weight:700;font-size:14.5px;line-height:1.15;}
  .brand .name span{color:#9fb4c4;font-weight:400;font-size:11px;display:block;margin-top:2px;}
  .who{display:flex;align-items:center;gap:9px;flex:none;}
  .lvbadge{font-family:'IBM Plex Mono';font-size:10.5px;font-weight:700;color:#0d2436;background:var(--accent);
    padding:3px 6px;border-radius:2px;}
  .lvbadge.ro{background:#9fb4c4;}
  .who .u{font-size:12px;color:#dbe6ee;}
  .who .u b{color:#fff;}
  @media(max-width:860px){.who .u{display:none;}.brand .name span{display:none;}}

  .tabs{display:flex;gap:2px;background:var(--navy-2);padding:0 12px;overflow-x:auto;
    position:sticky;top:56px;z-index:19;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabbtn{padding:11px 13px;font-size:12.8px;font-weight:600;color:#b9cbd8;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap;}
  .tabbtn.active{color:#fff;border-bottom-color:var(--accent);}
  .tabbtn .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;
    background:var(--danger);color:#fff;border-radius:8px;font-size:10px;margin-left:4px;padding:0 4px;font-family:'IBM Plex Mono';}

  main{flex:1;padding:18px 16px 70px;max-width:1200px;width:100%;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--steel-line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;}
  .panel-head{padding:13px 16px;border-bottom:1px solid var(--steel-line);background:var(--panel-alt);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .panel-head h2{margin:0;font-size:14.5px;font-weight:700;}
  .panel-head .sub{font-size:11.5px;color:var(--text-mute);margin-top:3px;line-height:1.5;}
  .panel-body{padding:16px;}

  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th{text-align:left;font-size:11px;color:var(--text-mute);padding:9px 10px;
    border-bottom:1px solid var(--steel-line);background:var(--panel-alt);font-weight:600;white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid #eef1f4;font-family:'IBM Plex Mono',monospace;font-size:12.5px;vertical-align:middle;}
  td.kr{font-family:'IBM Plex Sans KR';}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fbfcfd;}
  td input,td select{padding:6px 7px;font-size:13px;}

  .tag{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono';white-space:nowrap;}
  .t-out{background:#fbe9e6;color:var(--danger);}
  .t-in{background:#e8f5ee;color:var(--ok);}
  .t-ret{background:#e8f0f9;color:var(--info);}
  .t-adj{background:#efe9f7;color:#6b46a8;}
  .t-can{background:#eceff2;color:#5f7080;}
  .t-ok{background:#e8f5ee;color:var(--ok);}
  .t-warn{background:#fdf3de;color:var(--warn);}
  .t-danger{background:#fbe9e6;color:var(--danger);}
  .t-pend{background:#fdf3de;color:var(--warn);}
  .t-grey{background:#eceff2;color:#5f7080;}

  .gauge{width:100%;min-width:80px;height:8px;background:#e3e8ec;border-radius:4px;overflow:hidden;}
  .gauge-fill{height:100%;background:var(--ok);}
  .gauge-fill.warn{background:var(--warn);}
  .gauge-fill.danger{background:var(--danger);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:700px){.grid3{grid-template-columns:1fr 1fr;}}
  .statcard{background:var(--panel);border:1px solid var(--steel-line);border-radius:var(--r);padding:13px 15px;}
  .statcard .lbl{font-size:11px;color:var(--text-mute);font-weight:600;}
  .statcard .val{font-family:'IBM Plex Mono';font-size:24px;font-weight:700;margin-top:4px;color:var(--navy);}
  .statcard .val small{font-size:12px;color:var(--text-mute);font-weight:500;}

  .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .form-row .field{flex:1;min-width:150px;margin-bottom:0;}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .filters select,.filters input{width:auto;flex:1;min-width:120px;padding:8px 9px;font-size:13px;}
  .empty{padding:30px;text-align:center;color:var(--text-mute);font-size:13px;font-family:'IBM Plex Sans KR';}
  .idtag{font-family:'IBM Plex Mono';background:var(--panel-alt);border:1px solid var(--steel-line);
    padding:1px 6px;border-radius:2px;font-size:11.5px;}
  .footer-note{font-size:11px;color:var(--text-mute);text-align:center;padding:16px 0 34px;}

  .picker{border:1px solid var(--steel-line);border-radius:var(--r);overflow:hidden;}
  .picker-search{padding:9px;border-bottom:1px solid var(--steel-line);background:var(--panel-alt);}
  .picker-list{max-height:230px;overflow-y:auto;}
  .pitem{padding:10px 12px;border-bottom:1px solid #eef1f4;cursor:pointer;display:flex;
    align-items:center;justify-content:space-between;gap:10px;}
  .pitem:hover{background:#fbfcfd;}
  .pitem.sel{background:#fff4ec;box-shadow:inset 3px 0 0 var(--accent);}
  .pitem .nm{font-size:13.5px;font-weight:500;}
  .pitem .st{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-mute);white-space:nowrap;}
  .fav{font-size:10.5px;color:var(--accent);font-weight:700;margin-left:6px;}

  .qty-box{border:1px solid var(--steel-line);border-radius:var(--r);padding:14px;background:var(--panel-alt);}
  .qty-display{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .qty-display input{font-family:'IBM Plex Mono';font-size:30px;font-weight:700;text-align:right;
    padding:8px 12px;height:56px;background:#fff;}
  .qty-unit{font-family:'IBM Plex Mono';font-size:15px;color:var(--text-mute);font-weight:600;min-width:44px;}
  .qty-rows{display:flex;flex-direction:column;gap:7px;}
  .qty-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  .qbtn{padding:11px 4px;border:1px solid var(--steel-line);background:#fff;border-radius:var(--r);
    font-family:'IBM Plex Mono';font-size:14px;font-weight:600;cursor:pointer;color:var(--navy);}
  .qbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .qbtn.minus{color:var(--danger);}
  .qbtn.minus:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
  .qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .qchip{padding:7px 12px;border:1px solid var(--accent);color:var(--accent-dark);background:#fff;
    border-radius:20px;font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;cursor:pointer;}
  .qchip:hover{background:var(--accent);color:#fff;}
  .qclear{padding:7px 12px;border:1px solid var(--steel-line);color:var(--text-mute);background:#fff;
    border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .qty-meta{font-size:11.5px;color:var(--text-mute);margin-top:9px;line-height:1.55;}

  .seg{display:flex;border:1px solid var(--steel-line);border-radius:var(--r);overflow:hidden;width:fit-content;}
  .segbtn{padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-mute);border-right:1px solid var(--steel-line);}
  .segbtn:last-child{border-right:none;}
  .segbtn.on{background:var(--navy);color:#fff;}
  .readonly-bar{background:#eceff2;border:1px solid var(--steel-line);border-left:4px solid #5f7080;
    padding:9px 12px;font-size:12.5px;color:#485663;border-radius:var(--r);margin-bottom:14px;}

  .syncdot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#9fb4c4;font-family:'IBM Plex Mono';}
  .syncdot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;}
  .syncdot.busy i{background:var(--warn);}
  .syncdot.err i{background:var(--danger);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 18px;border-radius:4px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:90%;}
  .toast.err{background:var(--danger);}
  .setup{max-width:700px;margin:50px auto;background:#fff;border:1px solid var(--steel-line);padding:28px;border-radius:var(--r);}
  .setup h1{font-size:19px;margin:0 0 12px;}
  .setup code{background:#f3f6f8;padding:2px 6px;border-radius:2px;font-family:'IBM Plex Mono';font-size:13px;}
  .setup pre{background:#0d2436;color:#e8edf1;padding:14px;border-radius:3px;overflow-x:auto;font-size:12.5px;font-family:'IBM Plex Mono';}
  ::placeholder{color:#9aa9b6;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   ▼▼▼  여기 두 줄만 본인 것으로 바꾸세요  ▼▼▼
   Supabase → Project Settings → API 에서 복사합니다.
   ══════════════════════════════════════════════════════════════ */
const SUPABASE_URL      = "https://mmmyzlplgemewjhapwwk.supabase.co";
const SUPABASE_ANON_KEY = "xogus0361A540663!";
/* ══════════════════════════════════════════════════════════════
   ▲▲▲  나머지는 건드리지 마세요  ▲▲▲
   ══════════════════════════════════════════════════════════════ */

(function(){
"use strict";

const COMPANIES = ["진영","창성","비스코","DHI","I-Tec","HSG","장비팀"];
const LEVEL_NAME = {1:"부자재 수령자",2:"업체 공구장",3:"부서 총괄 공구장",4:"총관리자"};

if(String(SUPABASE_URL).indexOf("http")!==0){
  document.getElementById("app").innerHTML=`<div class="setup">
    <h1>서버 연결 설정이 필요합니다</h1>
    <p style="line-height:1.7;font-size:13.5px;">이 파일 상단의 두 줄을 본인 Supabase 프로젝트 값으로 바꾼 뒤 다시 업로드하세요.</p>
    <pre>const SUPABASE_URL      = "https://xxxxxxxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOi...";</pre>
    <p style="line-height:1.7;font-size:13.5px;">값은 Supabase 대시보드의 <code>Project Settings → API</code>에 있는
    <b>Project URL</b>과 <b>anon public</b> 키입니다.</p></div>`;
  return;
}

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let S = {
  user:null, tab:"dash", authTab:"login", authMsg:null,
  users:[], items:[], logs:[], requests:[], emergencies:[], stocktakes:[],
  reqMonth:nextMonth(), viewCompany:null,
  wMode:"out", wItem:null, wQty:0, wSearch:"", wMsg:null, wTeam:"", wCompany:null,
  logFilter:{company:"",item:"",team:"",type:"",from:"",to:""},
  sync:"ok", lastSync:0
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nf(n){ return Number(n||0).toLocaleString("ko-KR"); }
function nextMonth(){ const d=new Date(); d.setMonth(d.getMonth()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16); }
function fmt(ts,short){ const d=new Date(Number(ts));
  return short?d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})
              :d.toLocaleString("ko-KR"); }
function toast(m,err){ const t=document.createElement("div");
  t.className="toast"+(err?" err":""); t.textContent=m; document.body.appendChild(t);
  setTimeout(()=>t.remove(),3200); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k);
  if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }

const M = {
  userIn:r=>({id:r.id,pass:r.pass,name:r.name,company:r.company,level:r.level,readOnly:r.read_only,
    pwChanged:r.pw_changed,status:r.status,createdAt:Number(r.created_at),lastLogin:Number(r.last_login)}),
  userOut:u=>({id:u.id,pass:u.pass,name:u.name,company:u.company,level:u.level,read_only:!!u.readOnly,
    pw_changed:!!u.pwChanged,status:u.status,created_at:u.createdAt||0,last_login:u.lastLogin||0}),
  itemIn:r=>({id:r.id,name:r.name,unit:r.unit,stock:r.stock,minStock:r.min_stock,step:r.step}),
  itemOut:i=>({id:i.id,name:i.name,unit:i.unit,stock:i.stock,min_stock:i.minStock,step:i.step||1}),
  logIn:r=>({id:r.id,ts:Number(r.ts),type:r.type,company:r.company,itemId:r.item_id,itemName:r.item_name,
    unit:r.unit,qty:r.qty,taker:r.taker,team:r.team,by:r.by_id,byName:r.by_name,void:r.void,
    voidReason:r.void_reason,voidBy:r.void_by,voidAt:r.void_at,refId:r.ref_id}),
  logOut:l=>({id:l.id,ts:l.ts,type:l.type,company:l.company,item_id:l.itemId,item_name:l.itemName,
    unit:l.unit,qty:l.qty,taker:l.taker,team:l.team,by_id:l.by,by_name:l.byName,void:!!l.void,ref_id:l.refId||null}),
  reqIn:r=>({id:r.id,month:r.month,company:r.company,itemId:r.item_id,itemName:r.item_name,
    requestedQty:r.requested_qty,adjustedQty:r.adjusted_qty,comment:r.comment}),
  reqOut:r=>({id:r.id,month:r.month,company:r.company,item_id:r.itemId,item_name:r.itemName,
    requested_qty:r.requestedQty,adjusted_qty:r.adjustedQty,comment:r.comment,
    updated_by:r.updatedBy||"",updated_at:r.updatedAt||Date.now()}),
  emgIn:r=>({id:r.id,ts:Number(r.ts),company:r.company,itemId:r.item_id,itemName:r.item_name,qty:r.qty,
    category:r.category,note:r.note,team:r.team,by:r.by_id,byName:r.by_name,status:r.status,handledBy:r.handled_by}),
  emgOut:e=>({id:e.id,ts:e.ts,company:e.company,item_id:e.itemId,item_name:e.itemName,qty:e.qty,
    category:e.category,note:e.note,team:e.team,by_id:e.by,by_name:e.byName,status:e.status,handled_by:e.handledBy||""}),
  stkIn:r=>({id:r.id,ts:Number(r.ts),by:r.by_id,byName:r.by_name,note:r.note,lines:r.lines||[],total:r.total}),
  stkOut:s=>({id:s.id,ts:s.ts,by_id:s.by,by_name:s.byName,note:s.note,lines:s.lines,total:s.total})
};

function setSync(v){ S.sync=v; const el=document.getElementById("syncDot");
  if(el) el.className="syncdot"+(v==="busy"?" busy":v==="err"?" err":""); }

async function pull(){
  setSync("busy");
  try{
    const [u,i,l,r,e,s]=await Promise.all([
      db.from("users").select("*"),
      db.from("items").select("*").order("name"),
      db.from("logs").select("*").order("ts",{ascending:false}).limit(5000),
      db.from("requests").select("*"),
      db.from("emergencies").select("*").order("ts",{ascending:false}),
      db.from("stocktakes").select("*").order("ts",{ascending:false})
    ]);
    const bad=[u,i,l,r,e,s].find(x=>x.error);
    if(bad) throw bad.error;
    S.users=(u.data||[]).map(M.userIn);
    S.items=(i.data||[]).map(M.itemIn);
    S.logs=(l.data||[]).map(M.logIn);
    S.requests=(r.data||[]).map(M.reqIn);
    S.emergencies=(e.data||[]).map(M.emgIn);
    S.stocktakes=(s.data||[]).map(M.stkIn);
    if(S.user){ const me=S.users.find(x=>x.id===S.user.id); if(me) S.user=me; }
    S.lastSync=Date.now(); setSync("ok"); return true;
  }catch(err){
    console.error(err); setSync("err");
    toast("서버 연결에 실패했습니다. 인터넷 상태를 확인하세요.",true);
    return false;
  }
}

async function push(fn,okMsg){
  setSync("busy");
  try{ const res=await fn(); if(res&&res.error) throw res.error;
    setSync("ok"); if(okMsg) toast(okMsg); return res||{ok:true}; }
  catch(err){ console.error(err); setSync("err");
    toast("저장 실패: "+(err.message||"서버 오류"),true); return null; }
}

function bindAuth(){
  document.querySelectorAll("[data-at]").forEach(el=>el.onclick=()=>{ S.authTab=el.dataset.at; S.authMsg=null; render(); });
  const f=document.getElementById("fLogin");
  if(f) f.onsubmit=async e=>{
    e.preventDefault();
    const id=document.getElementById("li_id").value.trim();
    const pw=document.getElementById("li_pw").value;
    await pull();
    const u=S.users.find(x=>x.id===id);
    if(!u){ S.authMsg={t:"e",m:"등록되지 않은 아이디입니다."}; return render(); }
    if(u.status==="pending"){ S.authMsg={t:"w",m:"승인 대기중입니다. 업체 공구장 또는 총괄 공구장의 승인을 기다려 주세요."}; return render(); }
    if(u.status==="suspended"){ S.authMsg={t:"e",m:"정지된 계정입니다."}; return render(); }
    if(u.pass!==pw){ S.authMsg={t:"e",m:"비밀번호가 일치하지 않습니다."}; return render(); }
    u.lastLogin=Date.now();
    await push(()=>db.from("users").upsert(M.userOut(u)));
    S.user=u; S.authMsg=null; S.tab="dash"; ls("bz_session",u.id);
    render(); startPoll();
  };
  const g=document.getElementById("fSignup");
  if(g) g.onsubmit=async e=>{
    e.preventDefault();
    const co=document.getElementById("su_co").value;
    const no=document.getElementById("su_no").value.trim();
    const nm=document.getElementById("su_nm").value.trim();
    if(!no||!nm) return;
    await pull();
    const id=co+no;
    if(S.users.some(u=>u.id===id)){ S.authMsg={t:"e",m:`이미 등록된 아이디입니다 (${id}).`}; return render(); }
    const first=S.users.length===0;
    const u={id,pass:nm,name:nm,company:co,level:first?4:1,status:first?"approved":"pending",
      readOnly:false,pwChanged:false,createdAt:Date.now(),lastLogin:0};
    const r=await push(()=>db.from("users").insert(M.userOut(u)));
    if(!r) return;
    if(first && S.items.length===0){
      await push(()=>db.from("items").insert(seedItems().map(M.itemOut)));
    }
    S.authTab="login";
    S.authMsg=first
      ? {t:"o",m:`최초 가입자이므로 총관리자(Lv.4)로 자동 승인되었습니다. 기본 품목 30종도 등록했습니다. 아이디: ${id} / 비밀번호: ${nm}`}
      : {t:"o",m:`가입 신청 완료. 아이디: ${id} · 승인 후 로그인할 수 있습니다.`};
    render();
  };
}

function bindWithdraw(){
  document.querySelectorAll("[data-mode]").forEach(el=>el.onclick=()=>{ S.wMode=el.dataset.mode; S.wMsg=null; render(); });
  const se=document.getElementById("wSearch");
  if(se) se.oninput=()=>{ S.wSearch=se.value; const p=se.selectionStart; render();
    const n=document.getElementById("wSearch"); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  document.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{ S.wItem=el.dataset.pick; S.wQty=0; S.wMsg=null; render(); });
  const q=document.getElementById("wQty");
  if(q){ q.oninput=()=>{ S.wQty=Math.max(0,parseInt(q.value,10)||0);
    const b=document.getElementById("wSubmit"); if(b) b.disabled=!S.wQty; }; q.onblur=()=>render(); }
  document.querySelectorAll("[data-add]").forEach(el=>el.onclick=()=>{ S.wQty=Math.max(0,(S.wQty||0)+ +el.dataset.add); render(); });
  document.querySelectorAll("[data-set]").forEach(el=>el.onclick=()=>{ S.wQty=+el.dataset.set; render(); });
  const co=document.getElementById("wCo"); if(co) co.onchange=()=>{ S.wCompany=co.value; };
  const tm=document.getElementById("wTeam"); if(tm) tm.oninput=()=>{ S.wTeam=tm.value; };

  const sub=document.getElementById("wSubmit");
  if(sub) sub.onclick=async()=>{
    const it=item(S.wItem); if(!it||!S.wQty) return;
    const company=lv(3)?document.getElementById("wCo").value:S.user.company;
    const taker=document.getElementById("wTaker").value.trim();
    const team=document.getElementById("wTeam").value.trim();
    const tv=document.getElementById("wTime").value;
    if(!taker||!team){ S.wMsg={t:"e",m:"가져가는 사람과 작업팀은 반드시 입력해야 합니다."}; return render(); }
    const qty=S.wQty, delta=S.wMode==="out"?-qty:qty, mode=S.wMode;
    sub.disabled=true; sub.textContent="저장 중…";
    const log={id:uid(),ts:tv?new Date(tv).getTime():Date.now(),type:mode,company,
      itemId:it.id,itemName:it.name,unit:it.unit,qty,taker,team,by:S.user.id,byName:S.user.name};
    const res=await push(()=>db.rpc("apply_movement",{p_log:M.logOut(log),p_item_id:it.id,p_delta:delta}));
    if(!res){ S.wMsg={t:"e",m:"저장에 실패했습니다. 다시 시도해 주세요."}; return render(); }
    await pull();
    const cur=item(it.id);
    S.wMsg={t:"o",m:`${it.name} ${nf(qty)}${it.unit} ${mode==="out"?"불출":"반납"} 완료 · 현재 재고 ${nf(cur?cur.stock:0)}${it.unit}`};
    S.wQty=0; S.wTeam=team; render();
  };
}

function bindLogs(){
  const map={f_company:"company",f_item:"item",f_type:"type",f_team:"team",f_from:"from",f_to:"to"};
  Object.keys(map).forEach(id=>{ const el=document.getElementById(id);
    if(el) el.onchange=()=>{ S.logFilter[map[id]]=el.value; render(); }; });
  const t=document.getElementById("f_team");
  if(t) t.oninput=()=>{ S.logFilter.team=t.value; const p=t.selectionStart; render();
    const n=document.getElementById("f_team"); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const r=document.getElementById("f_reset");
  if(r) r.onclick=()=>{ S.logFilter={company:"",item:"",team:"",type:"",from:"",to:""}; render(); };
  document.querySelectorAll(".lvoid").forEach(el=>el.onclick=async()=>{
    const l=S.logs.find(x=>x.id===el.dataset.id); if(!l) return;
    const reason=prompt("정정 사유를 입력하세요. 원본은 삭제되지 않고 취소 이력이 함께 남습니다.");
    if(reason===null||!reason.trim()) return;
    const delta=l.type==="out"?l.qty:-l.qty;
    const cancel={id:uid(),ts:Date.now(),type:"cancel",company:l.company,itemId:l.itemId,itemName:l.itemName,
      unit:l.unit,qty:l.qty,taker:l.taker,team:"정정: "+reason.trim(),by:S.user.id,byName:S.user.name,refId:l.id};
    if(!await push(()=>db.rpc("apply_movement",{p_log:M.logOut(cancel),p_item_id:l.itemId,p_delta:delta}))) return;
    await push(()=>db.from("logs").update({void:true,void_reason:reason.trim(),
      void_by:S.user.name,void_at:Date.now()}).eq("id",l.id),"정정 처리되었습니다.");
    await pull(); render();
  });

        <td class="kr">${esc(s.note||"-")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">실사 이력이 없습니다.</td></tr>'}</tbody></table></div></div>`;

function bindStk(){
  document.querySelectorAll(".sk").forEach(el=>el.oninput=()=>{
    const it=item(el.dataset.id);
    const cell=document.querySelector(`.skdiff[data-id="${el.dataset.id}"]`);
    if(el.value===""){ cell.textContent="-"; cell.style.color="var(--text-mute)"; return; }
    const d=(parseInt(el.value,10)||0)-it.stock;
    cell.textContent=(d>0?"+":"")+nf(d);
    cell.style.color=d<0?"var(--danger)":d>0?"var(--info)":"var(--ok)"; });
  const b=document.getElementById("skSave");
  if(b) b.onclick=async()=>{
    const lines=[];
    document.querySelectorAll(".sk").forEach(el=>{
      if(el.value==="") return;
      const it=item(el.dataset.id),real=parseInt(el.value,10)||0;
      lines.push({itemId:it.id,itemName:it.name,system:it.stock,real,diff:real-it.stock,unit:it.unit}); });
    if(!lines.length){ alert("실물 수량을 하나 이상 입력하세요."); return; }
    if(!confirm(`${lines.length}개 품목의 재고를 실사값으로 보정합니다. 진행할까요?`)) return;
    b.disabled=true; b.textContent="처리 중…";
    const note=document.getElementById("skNote").value.trim();
    for(const l of lines){
      await push(()=>db.from("items").update({stock:l.real}).eq("id",l.itemId));
      if(l.diff!==0){
        const lg={id:uid(),ts:Date.now(),type:"adj",company:"-",itemId:l.itemId,itemName:l.itemName,
          unit:l.unit,qty:Math.abs(l.diff),taker:S.user.name,team:`실사보정 ${l.diff>0?"+":""}${l.diff}`,
          by:S.user.id,byName:S.user.name};
        await push(()=>db.from("logs").insert(M.logOut(lg)));
      }
    }
    await push(()=>db.from("stocktakes").insert(M.stkOut({id:uid(),ts:Date.now(),by:S.user.id,
      byName:S.user.name,note,lines,total:lines.reduce((s,l)=>s+l.diff,0)})),"실사가 확정되었습니다.");
    await pull(); render();
  };
  const c=document.getElementById("csvStk");
  if(c) c.onclick=()=>{ const rows=[];
    S.stocktakes.forEach(s=>s.lines.forEach(l=>rows.push([fmt(s.ts),s.byName,l.itemName,l.system,l.real,l.diff,s.note||""])));
    exportCSV("재고실사",["일시","실사자","품목","시스템재고","실물수량","차이","메모"],rows); };
}

function bindUsers(){
  const U=id=>S.users.find(u=>u.id===id);
  const saveU=async u=>{ if(await push(()=>db.from("users").upsert(M.userOut(u)),"저장되었습니다.")){ await pull(); render(); } };
  document.querySelectorAll(".apOk").forEach(el=>el.onclick=()=>{
    const u=U(el.dataset.id);
    u.status="approved"; u.level=+document.querySelector(`.apLv[data-id="${CSS.escape(el.dataset.id)}"]`).value;
    saveU(u); });
  document.querySelectorAll(".apNo").forEach(el=>el.onclick=async()=>{
    if(!confirm("가입 신청을 거절하고 삭제합니다.")) return;
    if(await push(()=>db.from("users").delete().eq("id",el.dataset.id),"삭제되었습니다.")){ await pull(); render(); } });
  document.querySelectorAll(".chLv").forEach(el=>el.onchange=()=>{ const u=U(el.dataset.id); u.level=+el.value; saveU(u); });
  document.querySelectorAll(".chRo").forEach(el=>el.onchange=()=>{ const u=U(el.dataset.id); u.readOnly=el.checked; saveU(u); });
  document.querySelectorAll(".uSp").forEach(el=>el.onclick=()=>{ const u=U(el.dataset.id); u.status="suspended"; saveU(u); });
  document.querySelectorAll(".uRe").forEach(el=>el.onclick=()=>{ const u=U(el.dataset.id); u.status="approved"; saveU(u); });
  document.querySelectorAll(".uPw").forEach(el=>el.onclick=()=>{ const u=U(el.dataset.id);
    if(!confirm(`${u.name} 계정 비밀번호를 이름("${u.name}")으로 초기화합니다.`)) return;
    u.pass=u.name; u.pwChanged=false; saveU(u); });
}

      requests:S.requests,emergencies:S.emergencies,stocktakes:S.stocktakes},null,2),"application/json");

/* ── 내보내기 ── */
function download(name,content,mime){
  try{
    const blob=new Blob(["\uFEFF"+content],{type:mime+";charset=utf-8;"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  }catch(e){ alert("다운로드가 차단되었습니다. 브라우저 설정을 확인하세요."); }
}
function exportCSV(name,head,rows){
  const q=v=>{ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  download(name+"_"+new Date().toISOString().slice(0,10)+".csv",
    [head.map(q).join(",")].concat(rows.map(r=>r.map(q).join(","))).join("\r\n"),"text/csv");
}
